# XcodeGen spec used by CI as a fallback (and for anyone who prefers an .xcodeproj).
name: X32Remote
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  X32Remote:
    type: application
    platform: iOS
    sources:
      - path: ../X32Remote.swiftpm/App
      - path: ../X32Remote.swiftpm/Core
      - path: ../X32Remote.swiftpm/UI
      - path: ../X32Remote.swiftpm/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.taine.x32remote
        PRODUCT_NAME: X32Remote
        INFOPLIST_KEY_CFBundleDisplayName: "X32 Remote"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "X32 Remote talks to your X32 mixer over the local network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
