name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push gets built; an older build still waiting is dropped.
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    # Runs on Taine's own Mac (a self-hosted runner), so GitHub doesn't charge for build minutes.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      OUT: ${{ github.workspace }}/ci-out
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$OUT"
          xcodebuild -version | tee "$OUT/xcode-version.txt"
          swift --version | tee -a "$OUT/xcode-version.txt"
          xcrun simctl list devices available | tee "$OUT/simulators.txt" | head -40

      - name: Core unit tests
        run: ./ci/core-tests.sh

      - name: Build X32 emulator
        run: ./ci/build-emulator.sh

      - name: Build app for iOS Simulator
        run: ./ci/build-app.sh

      - name: Screenshots and emulator integration test
        run: ./ci/run-sim.sh

      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/publish-results.sh
